name: MacMonitor
options:
  bundleIdPrefix: com.fbrogno
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: de    # texts are German at the source, English comes from the .xcstrings catalogs
configFiles:
  Debug: Config/Sparkle.xcconfig
  Release: Config/Sparkle.xcconfig
packages:
  MacMonitorPackage:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1 # same as Package.resolved; a release never pulls a newer Sparkle
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"      # build-app.sh overrides this from VERSION
    CURRENT_PROJECT_VERSION: "1"    # build-app.sh overrides this with the commit count
targets:
  MacMonitor:
    type: application
    platform: macOS
    sources:
      - path: Sources/MacMonitor
      # The icon is a prebuilt .icns, copied as a plain resource.
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: MacMonitorPackage
        product: MonitorCore
      - package: MacMonitorPackage
        product: WidgetViews
      - package: Sparkle
        product: Sparkle
      # Embedded into Contents/PlugIns; build-app.sh signs it with the sandbox entitlements.
      - target: MacMonitorWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fbrogno.macmonitor
        PRODUCT_NAME: MacMonitor
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        COMBINE_HIDPI_IMAGES: YES
  MacMonitorWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/MacMonitorWidgets
    dependencies:
      - package: MacMonitorPackage
        product: MonitorCore
      - package: MacMonitorPackage
        product: WidgetViews
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fbrogno.macmonitor.widgets
        PRODUCT_NAME: MacMonitorWidgets
        INFOPLIST_FILE: Sources/MacMonitorWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        # The sandbox and the app group come from the entitlements build-app.sh signs with.
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_STYLE: Manual
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  MacMonitor:
    build:
      targets:
        MacMonitor: all
